[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "reasoning-env-test"
version = "0.1.0"
description = "Reasoning Environment Test Toolkit"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning_env_test*"]
